<!doctype html>
<html lang="zh" data-resolution="portrait">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 产品科普 · 清新剪纸分层动效</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #F7F2E8;
      font-family: "Noto Sans SC", sans-serif;
    }

    #main-composition {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 12%, rgba(190, 230, 210, 0.28), transparent 50%),
        linear-gradient(180deg, #FBF8F1 0%, #F3EDE2 100%);
    }

    .paper-noise {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      pointer-events: none;
      z-index: 80;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
    }

    .deck { position: absolute; inset: 0; }

    .scene {
      position: absolute;
      inset: 0;
      will-change: opacity;
    }

    .card {
      position: absolute;
      left: 36px;
      right: 36px;
      top: 36px;
      bottom: 72px;
      border-radius: 28px;
      overflow: hidden;
      background: #FFFCF7;
      box-shadow:
        0 16px 36px rgba(90, 70, 40, 0.12),
        0 2px 0 rgba(255, 255, 255, 0.65) inset;
    }

    .card-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      background: #FFFCF7;
    }

    /* Soft bridge caption — only during fade gap, never covers settled art */
    .bridge-layer {
      position: absolute;
      left: 80px;
      right: 80px;
      bottom: 96px;
      z-index: 60;
      pointer-events: none;
    }

    .bridge {
      margin: 0 auto;
      width: fit-content;
      max-width: 920px;
      padding: 22px 36px;
      border-radius: 999px;
      background: rgba(255, 252, 247, 0.92);
      border: 2px solid rgba(40, 40, 40, 0.08);
      box-shadow: 0 10px 24px rgba(90, 70, 40, 0.1);
      font-size: 36px;
      font-weight: 700;
      text-align: center;
      color: #2A2A2A;
      line-height: 1.3;
    }
    .bridge .hi { color: #E35D4B; }

    .progress {
      position: absolute;
      left: 80px;
      right: 80px;
      bottom: 28px;
      height: 8px;
      border-radius: 999px;
      background: rgba(40, 40, 40, 0.08);
      overflow: hidden;
      z-index: 70;
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7BC4A0, #E35D4B);
      border-radius: inherit;
    }
  </style>
</head>
<body>
  <!--
    Pacing (40s total):
    each card: fade in 1.0s → hold readable 5.2s → fade out 0.9s
    between cards: soft bridge 0.8s while both near black/empty
  -->
  <div id="main-composition" data-composition-id="main" data-width="1080" data-height="1920" data-duration="40" data-start="0">
    <div class="paper-noise"></div>

    <div class="deck">
      <section class="scene" id="s1">
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-01-hook.png" alt="" />
        </div>
      </section>
      <section class="scene" id="s2">
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-02-myth.png" alt="" />
        </div>
      </section>
      <section class="scene" id="s3">
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-03-structure.png" alt="" />
        </div>
      </section>
      <section class="scene" id="s4">
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-04-experience.png" alt="" />
        </div>
      </section>
      <section class="scene" id="s5">
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-05-takeaway.png" alt="" />
        </div>
      </section>
    </div>

    <div class="bridge-layer" id="bridge">
      <div class="bridge" id="bridgeText">桥接</div>
    </div>

    <div class="progress"><i id="bar"></i></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const scenes = ["#s1", "#s2", "#s3", "#s4", "#s5"];
    const bridges = [
      "先把常见误区<span class='hi'>划掉</span>",
      "再按顺序拆开结构",
      "能力不该抢戏",
      "带走一句就够"
    ];

    // All hidden initially except we'll fade s1 in
    gsap.set(scenes, { autoAlpha: 0 });
    gsap.set("#bridge", { autoAlpha: 0 });
    gsap.set("#bar", { width: "0%" });

    const FADE_IN = 1.05;
    const HOLD = 5.4;
    const FADE_OUT = 0.95;
    const BRIDGE = 0.85;
    const TOTAL = 40;

    tl.to("#bar", { width: "100%", duration: TOTAL, ease: "none" }, 0);

    /**
     * Show a scene fully, hold for reading, then soft fade out.
     * Returns the timeline time when the scene has finished fading out.
     */
    function playScene(id, startAt, isLast = false) {
      // fade in from empty
      tl.fromTo(id,
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: FADE_IN, ease: "power1.inOut" },
        startAt
      );
      const holdEnd = startAt + FADE_IN + HOLD;
      if (!isLast) {
        tl.to(id, {
          autoAlpha: 0,
          duration: FADE_OUT,
          ease: "power1.inOut"
        }, holdEnd);
        return holdEnd + FADE_OUT;
      }
      // last card: longer settle, stay visible
      tl.to(id, {
        autoAlpha: 1,
        duration: 0.01
      }, holdEnd);
      return holdEnd + 2.2;
    }

    function playBridge(text, at) {
      tl.call(() => {
        document.querySelector("#bridgeText").innerHTML = text;
      }, null, at);
      // bridge appears in the empty beat between fades
      tl.fromTo("#bridge",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.35, ease: "power1.out" },
        at
      );
      tl.to("#bridge", {
        autoAlpha: 0,
        duration: 0.35,
        ease: "power1.in"
      }, at + BRIDGE - 0.35);
    }

    // Timeline choreography: display complete → fade out → bridge → fade in next
    let t = 0.15;
    t = playScene("#s1", t, false);          // done fading out
    playBridge(bridges[0], t - 0.15);        // overlap slightly with end of fade-out
    t += BRIDGE;

    t = playScene("#s2", t, false);
    playBridge(bridges[1], t - 0.15);
    t += BRIDGE;

    t = playScene("#s3", t, false);
    playBridge(bridges[2], t - 0.15);
    t += BRIDGE;

    t = playScene("#s4", t, false);
    playBridge(bridges[3], t - 0.15);
    t += BRIDGE;

    playScene("#s5", t, true);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
