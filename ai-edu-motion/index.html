<!doctype html>
<html lang="zh" data-resolution="portrait">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 产品科普 · 清新剪纸分层动效</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #F7F2E8;
      font-family: "Noto Sans SC", sans-serif;
    }

    #main-composition {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 12%, rgba(190, 230, 210, 0.28), transparent 50%),
        linear-gradient(180deg, #FBF8F1 0%, #F3EDE2 100%);
    }

    .paper-noise {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      pointer-events: none;
      z-index: 80;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
    }

    .deck {
      position: absolute;
      inset: 0;
    }

    .scene {
      position: absolute;
      inset: 0;
      will-change: transform, opacity;
    }

    /* Full-frame art: no overlays on top of the keyframe modules */
    .card {
      position: absolute;
      left: 36px;
      right: 36px;
      top: 36px;
      bottom: 72px;
      border-radius: 28px;
      overflow: hidden;
      background: #FFFCF7;
      box-shadow:
        0 16px 36px rgba(90, 70, 40, 0.12),
        0 2px 0 rgba(255, 255, 255, 0.65) inset;
    }

    .card-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      background: #FFFCF7;
    }

    /* Soft mask used only for entrance reveal — never covers settled frame */
    .reveal-mask {
      position: absolute;
      inset: 0;
      background: #F7F2E8;
      z-index: 5;
      pointer-events: none;
    }

    /* Bridge only appears BETWEEN cards; dim behind text, then clears */
    .bridge-layer {
      position: absolute;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .bridge-dim {
      position: absolute;
      inset: 0;
      background: rgba(247, 242, 232, 0.72);
    }

    .bridge {
      position: relative;
      width: 780px;
      padding: 36px 40px;
      border-radius: 28px;
      background: #FFFCF7;
      border: 2px solid rgba(40, 40, 40, 0.1);
      box-shadow: 0 18px 36px rgba(90, 70, 40, 0.16);
      font-size: 44px;
      font-weight: 700;
      text-align: center;
      color: #2A2A2A;
      line-height: 1.35;
    }
    .bridge .hi { color: #E35D4B; }

    /* Tiny side rail chips — ONLY in left/right gutters outside card art */
    .rail {
      position: absolute;
      top: 120px;
      bottom: 120px;
      width: 28px;
      z-index: 15;
      pointer-events: none;
    }
    .rail.left { left: 4px; }
    .rail.right { right: 4px; }

    .rail-dot {
      position: absolute;
      left: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #E35D4B;
      opacity: 0.35;
    }

    .progress {
      position: absolute;
      left: 80px;
      right: 80px;
      bottom: 28px;
      height: 8px;
      border-radius: 999px;
      background: rgba(40, 40, 40, 0.08);
      overflow: hidden;
      z-index: 70;
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7BC4A0, #E35D4B);
      border-radius: inherit;
    }
  </style>
</head>
<body>
  <div id="main-composition" data-composition-id="main" data-width="1080" data-height="1920" data-duration="32" data-start="0">
    <div class="paper-noise"></div>

    <div class="rail left">
      <div class="rail-dot" id="d1" style="top:8%"></div>
      <div class="rail-dot" id="d2" style="top:28%"></div>
      <div class="rail-dot" id="d3" style="top:48%"></div>
      <div class="rail-dot" id="d4" style="top:68%"></div>
      <div class="rail-dot" id="d5" style="top:88%"></div>
    </div>

    <div class="deck">
      <section class="scene" id="s1">
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-01-hook.png" alt="" />
          <div class="reveal-mask" id="m1"></div>
        </div>
      </section>

      <section class="scene" id="s2">
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-02-myth.png" alt="" />
          <div class="reveal-mask" id="m2"></div>
        </div>
      </section>

      <section class="scene" id="s3">
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-03-structure.png" alt="" />
          <div class="reveal-mask" id="m3"></div>
        </div>
      </section>

      <section class="scene" id="s4">
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-04-experience.png" alt="" />
          <div class="reveal-mask" id="m4"></div>
        </div>
      </section>

      <section class="scene" id="s5">
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-05-takeaway.png" alt="" />
          <div class="reveal-mask" id="m5"></div>
        </div>
      </section>
    </div>

    <!-- Bridges sit above everything only during transitions -->
    <div class="bridge-layer" id="bridge">
      <div class="bridge-dim" id="bridgeDim"></div>
      <div class="bridge" id="bridgeText">桥接</div>
    </div>

    <div class="progress"><i id="bar"></i></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const scenes = ["#s1", "#s2", "#s3", "#s4", "#s5"];
    const masks = ["#m1", "#m2", "#m3", "#m4", "#m5"];
    const bridges = [
      "先把常见误区<span class='hi'>划掉</span>",
      "再按顺序拆开结构",
      "能力不该抢戏",
      "带走一句就够"
    ];

    gsap.set(scenes.slice(1), { autoAlpha: 0, x: 140, scale: 0.96 });
    gsap.set("#s1", { autoAlpha: 1, x: 0, scale: 1 });
    gsap.set(masks, { yPercent: 0 });
    gsap.set("#bridge", { autoAlpha: 0 });
    gsap.set("#bridgeDim", { autoAlpha: 1 });
    gsap.set("#bar", { width: "0%" });
    gsap.set(["#d1","#d2","#d3","#d4","#d5"], { scale: 0.6, background: "#C9C2B4" });

    function markStep(n, at) {
      const ids = ["#d1","#d2","#d3","#d4","#d5"];
      tl.to(ids[n], { background: "#E35D4B", scale: 1.15, duration: 0.25, ease: "back.out(2)" }, at);
      if (n > 0) tl.to(ids[n - 1], { background: "#7BC4A0", scale: 1, duration: 0.2 }, at);
    }

    function revealCard(mask, at) {
      // wipe upward so modules are uncovered, not covered
      tl.fromTo(mask,
        { yPercent: 0 },
        { yPercent: -105, duration: 0.7, ease: "power2.inOut" },
        at
      );
    }

    function showBridge(text, at) {
      tl.call(() => { document.querySelector("#bridgeText").innerHTML = text; }, null, at);
      tl.fromTo("#bridge",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.22, ease: "power1.out" },
        at
      );
      tl.fromTo("#bridgeText",
        { y: 28, scale: 0.92 },
        { y: 0, scale: 1, duration: 0.32, ease: "power2.out" },
        at
      );
      tl.to("#bridge", { autoAlpha: 0, duration: 0.22, ease: "power1.in" }, at + 0.62);
    }

    function swapCard(from, to, at) {
      tl.to(from, {
        autoAlpha: 0, x: -100, scale: 0.95, duration: 0.5, ease: "power2.inOut"
      }, at);
      tl.fromTo(to,
        { autoAlpha: 0, x: 120, scale: 0.96 },
        { autoAlpha: 1, x: 0, scale: 1, duration: 0.55, ease: "power3.out" },
        at + 0.06
      );
    }

    // progress
    tl.to("#bar", { width: "100%", duration: 32, ease: "none" }, 0);

    // ===== 01 开场：完整露出画面模块 =====
    markStep(0, 0.05);
    revealCard("#m1", 0.15);
    tl.to("#s1 .card", { y: -8, duration: 1.1, ease: "sine.inOut" }, 1.4);
    tl.to("#s1 .card", { y: 0, duration: 1.1, ease: "sine.inOut" }, 2.5);
    // hold for reading — no chips on art

    // 01 → 02
    showBridge(bridges[0], 5.45);
    swapCard("#s1", "#s2", 6.15);
    markStep(1, 6.2);
    revealCard("#m2", 6.35);
    tl.to("#s2 .card", { scale: 1.015, duration: 0.9, yoyo: true, repeat: 1, ease: "sine.inOut" }, 7.4);

    // 02 → 03
    showBridge(bridges[1], 11.55);
    swapCard("#s2", "#s3", 12.25);
    markStep(2, 12.3);
    revealCard("#m3", 12.4);
    // emphasize structure readability with a gentle push-in
    tl.fromTo("#s3 .card-art",
      { scale: 1.04 },
      { scale: 1, duration: 1.2, ease: "power2.out" },
      12.5
    );

    // 03 → 04
    showBridge(bridges[2], 18.0);
    swapCard("#s3", "#s4", 18.7);
    markStep(3, 18.75);
    revealCard("#m4", 18.85);
    tl.to("#s4 .card", { y: -6, duration: 1.0, ease: "sine.inOut" }, 20.0);
    tl.to("#s4 .card", { y: 0, duration: 1.0, ease: "sine.inOut" }, 21.0);

    // 04 → 05
    showBridge(bridges[3], 24.35);
    swapCard("#s4", "#s5", 25.05);
    markStep(4, 25.1);
    revealCard("#m5", 25.2);
    tl.to("#s5 .card", { scale: 1.02, duration: 1.3, ease: "sine.inOut" }, 26.4);
    tl.to("#s5 .card", { scale: 1.0, duration: 1.3, ease: "sine.inOut" }, 27.7);
    // final hold — art fully visible

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
