<!doctype html>
<html lang="zh" data-resolution="portrait">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 产品科普 · 清新剪纸分层动效</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #F7F2E8;
      font-family: "Noto Sans SC", sans-serif;
    }

    #main-composition {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(190, 230, 210, 0.35), transparent 55%),
        linear-gradient(180deg, #FBF8F1 0%, #F3EDE2 100%);
    }

    .paper-noise {
      position: absolute;
      inset: 0;
      opacity: 0.08;
      pointer-events: none;
      z-index: 90;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
    }

    .deck {
      position: absolute;
      inset: 0;
    }

    .scene {
      position: absolute;
      inset: 0;
      will-change: transform, opacity;
    }

    .card {
      position: absolute;
      left: 48px;
      right: 48px;
      top: 160px;
      height: 1320px;
      border-radius: 36px;
      overflow: hidden;
      background: #FFFCF7;
      box-shadow:
        0 18px 40px rgba(90, 70, 40, 0.12),
        0 2px 0 rgba(255, 255, 255, 0.65) inset;
    }

    .card-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .tag {
      position: absolute;
      left: 72px;
      top: 72px;
      padding: 14px 28px;
      border-radius: 999px;
      background: #FFFCF7;
      border: 2px solid rgba(40, 40, 40, 0.12);
      box-shadow: 0 8px 18px rgba(90, 70, 40, 0.1);
      font-size: 34px;
      font-weight: 700;
      color: #2A2A2A;
      letter-spacing: 1px;
      z-index: 20;
    }

    .tag .accent { color: #E35D4B; }

    .caption {
      position: absolute;
      left: 64px;
      right: 64px;
      bottom: 120px;
      min-height: 160px;
      padding: 36px 40px;
      border-radius: 28px;
      background: rgba(255, 252, 247, 0.96);
      border: 2px solid rgba(40, 40, 40, 0.08);
      box-shadow: 0 14px 28px rgba(90, 70, 40, 0.12);
      font-size: 48px;
      font-weight: 700;
      line-height: 1.35;
      color: #222;
      z-index: 20;
      text-align: center;
    }

    .caption .hi { color: #E35D4B; }

    /* floating paper chips for layered motion */
    .chip {
      position: absolute;
      z-index: 30;
      padding: 18px 28px;
      border-radius: 18px;
      background: #FFFCF7;
      border: 2px solid rgba(40, 40, 40, 0.14);
      box-shadow: 0 10px 20px rgba(90, 70, 40, 0.14);
      font-size: 36px;
      font-weight: 700;
      color: #2A2A2A;
      white-space: nowrap;
    }

    .chip.coral {
      color: #E35D4B;
      border-color: rgba(227, 93, 75, 0.35);
    }

    .chip.mint {
      background: #EEF8F2;
      border-color: rgba(90, 170, 130, 0.35);
    }

    .stamp-x {
      position: absolute;
      z-index: 40;
      width: 160px;
      height: 160px;
      border: 12px solid #E35D4B;
      border-radius: 50%;
      box-shadow: 0 10px 24px rgba(227, 93, 75, 0.25);
    }
    .stamp-x::before,
    .stamp-x::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 88px;
      height: 12px;
      background: #E35D4B;
      border-radius: 8px;
    }
    .stamp-x::before { transform: translate(-50%, -50%) rotate(45deg); }
    .stamp-x::after { transform: translate(-50%, -50%) rotate(-45deg); }

    .progress {
      position: absolute;
      left: 120px;
      right: 120px;
      bottom: 48px;
      height: 10px;
      border-radius: 999px;
      background: rgba(40, 40, 40, 0.08);
      overflow: hidden;
      z-index: 50;
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7BC4A0, #E35D4B);
      border-radius: inherit;
    }

    .bridge {
      position: absolute;
      left: 50%;
      top: 50%;
      margin-left: -220px;
      margin-top: -70px;
      width: 440px;
      padding: 28px 24px;
      border-radius: 24px;
      background: #FFFCF7;
      border: 2px solid rgba(40, 40, 40, 0.1);
      box-shadow: 0 16px 32px rgba(90, 70, 40, 0.16);
      font-size: 40px;
      font-weight: 700;
      text-align: center;
      color: #2A2A2A;
      z-index: 60;
    }
    .bridge .hi { color: #E35D4B; }
  </style>
</head>
<body>
  <div id="main-composition" data-composition-id="main" data-width="1080" data-height="1920" data-duration="32" data-start="0">
    <div class="paper-noise"></div>

    <div class="deck">
      <!-- Scene 1: Hook -->
      <section class="scene" id="s1">
        <div class="tag">01 / <span class="accent">开场</span></div>
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-01-hook.png" alt="" />
        </div>
        <div class="chip coral" id="c1a" style="left:90px;top:210px;">AI</div>
        <div class="chip" id="c1b" style="left:760px;top:250px;">大模型</div>
        <div class="chip mint" id="c1c" style="left:120px;top:1380px;">风口</div>
        <div class="chip" id="c1d" style="left:700px;top:1420px;">智能</div>
        <div class="caption" id="cap1">到处都在说 <span class="hi">AI</span>，可它到底是什么？</div>
      </section>

      <!-- Scene 2: Myth -->
      <section class="scene" id="s2">
        <div class="tag">02 / <span class="accent">误区</span></div>
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-02-myth.png" alt="" />
        </div>
        <div class="chip" id="c2a" style="left:120px;top:280px;">对话框</div>
        <div class="stamp-x" id="stamp" style="left:460px;top:620px;"></div>
        <div class="chip coral" id="c2b" style="left:680px;top:1400px;">≠ 产品</div>
        <div class="caption" id="cap2">加个对话框 <span class="hi">≠</span> 做出了 AI 产品</div>
      </section>

      <!-- Scene 3: Structure -->
      <section class="scene" id="s3">
        <div class="tag">03 / <span class="accent">结构</span></div>
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-03-structure.png" alt="" />
        </div>
        <div class="chip mint" id="c3a" style="left:120px;top:300px;">① 场景</div>
        <div class="chip" id="c3b" style="left:420px;top:300px;">② 能力</div>
        <div class="chip coral" id="c3c" style="left:720px;top:300px;">③ 体验</div>
        <div class="caption" id="cap3">先问清：<span class="hi">帮谁？</span>解决什么？</div>
      </section>

      <!-- Scene 4: Experience -->
      <section class="scene" id="s4">
        <div class="tag">04 / <span class="accent">体验</span></div>
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-04-experience.png" alt="" />
        </div>
        <div class="chip" id="c4a" style="left:100px;top:260px;">模型</div>
        <div class="chip mint" id="c4b" style="left:720px;top:1360px;">流程里</div>
        <div class="caption" id="cap4">好的 AI 产品，让能力藏在<span class="hi">流程</span>里</div>
      </section>

      <!-- Scene 5: Takeaway -->
      <section class="scene" id="s5">
        <div class="tag">05 / <span class="accent">记住</span></div>
        <div class="card">
          <img class="card-art" src="assets/keyframes/locked-A-05-takeaway.png" alt="" />
        </div>
        <div class="chip coral" id="c5a" style="left:340px;top:280px;">真实问题</div>
        <div class="caption" id="cap5">先有真实问题，再谈模型</div>
      </section>
    </div>

    <!-- narrative bridge labels between cards -->
    <div class="bridge" id="b12">先把常见误区<span class="hi">划掉</span></div>
    <div class="bridge" id="b23">再拆开真正结构</div>
    <div class="bridge" id="b34">能力不该抢戏</div>
    <div class="bridge" id="b45">带走一句就够</div>

    <div class="progress"><i id="bar"></i></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const scenes = ["#s1", "#s2", "#s3", "#s4", "#s5"];
    const bridges = ["#b12", "#b23", "#b34", "#b45"];

    // initial state
    gsap.set(scenes.slice(1), { autoAlpha: 0, x: 120, scale: 0.94 });
    gsap.set("#s1", { autoAlpha: 1, x: 0, scale: 1 });
    gsap.set(bridges, { autoAlpha: 0, scale: 0.86, y: 24 });
    gsap.set(["#c1a","#c1b","#c1c","#c1d","#c2a","#c2b","#c3a","#c3b","#c3c","#c4a","#c4b","#c5a"], {
      autoAlpha: 0, scale: 0.7
    });
    gsap.set(["#cap1","#cap2","#cap3","#cap4","#cap5"], { autoAlpha: 0, y: 36 });
    gsap.set("#stamp", { autoAlpha: 0, scale: 1.6, rotation: -18 });
    gsap.set("#bar", { width: "0%" });

    function enterChips(ids, at, stagger = 0.12) {
      ids.forEach((id, i) => {
        const fromX = i % 2 === 0 ? -80 : 80;
        const fromY = i < 2 ? -60 : 70;
        tl.fromTo(id,
          { autoAlpha: 0, x: fromX, y: fromY, scale: 0.7, rotate: i % 2 ? 8 : -8 },
          { autoAlpha: 1, x: 0, y: 0, scale: 1, rotate: 0, duration: 0.55, ease: "back.out(1.6)" },
          at + i * stagger
        );
      });
    }

    function exitChips(ids, at) {
      ids.forEach((id, i) => {
        const toX = i % 2 === 0 ? -140 : 140;
        tl.to(id, {
          autoAlpha: 0, x: toX, y: -40, scale: 0.8, duration: 0.35, ease: "power2.in"
        }, at + i * 0.04);
      });
    }

    function showBridge(id, at) {
      tl.fromTo(id,
        { autoAlpha: 0, scale: 0.86, y: 24 },
        { autoAlpha: 1, scale: 1, y: 0, duration: 0.35, ease: "power2.out" },
        at
      );
      tl.to(id, { autoAlpha: 0, y: -18, duration: 0.28, ease: "power2.in" }, at + 0.55);
    }

    function swapCard(from, to, at, dir = 1) {
      // logical card handoff: current soft exits, next settles in
      tl.to(from, {
        autoAlpha: 0, x: -110 * dir, scale: 0.92, duration: 0.55, ease: "power2.inOut"
      }, at);
      tl.fromTo(to,
        { autoAlpha: 0, x: 120 * dir, scale: 0.94 },
        { autoAlpha: 1, x: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        at + 0.08
      );
    }

    // progress bar across full runtime
    tl.to("#bar", { width: "100%", duration: 32, ease: "none" }, 0);

    // ===== Scene 1: confusion gathers =====
    // 0.0 - 5.6
    enterChips(["#c1a", "#c1b", "#c1c", "#c1d"], 0.25, 0.14);
    tl.to("#cap1", { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.0);
    // gentle breathe on card for presence (not perpetual drift)
    tl.to("#s1 .card", { y: -10, duration: 1.2, ease: "sine.inOut" }, 2.0);
    tl.to("#s1 .card", { y: 0, duration: 1.2, ease: "sine.inOut" }, 3.2);
    tl.to("#c1a", { y: -8, duration: 0.45, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.0);

    // bridge 1→2: clear the noise, introduce correction
    exitChips(["#c1a", "#c1b", "#c1c", "#c1d"], 5.35);
    tl.to("#cap1", { autoAlpha: 0, y: -20, duration: 0.28 }, 5.4);
    showBridge("#b12", 5.55);
    swapCard("#s1", "#s2", 6.05, 1);

    // ===== Scene 2: myth stamped out =====
    // 6.05 - 12.0
    enterChips(["#c2a", "#c2b"], 6.55, 0.16);
    tl.to("#cap2", { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 6.9);
    tl.fromTo("#stamp",
      { autoAlpha: 0, scale: 1.7, rotation: -18 },
      { autoAlpha: 1, scale: 1, rotation: -8, duration: 0.4, ease: "back.out(2)" },
      7.5
    );
    tl.to("#stamp", { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1 }, 8.1);
    tl.to("#c2a", { x: -6, duration: 0.12, yoyo: true, repeat: 3, ease: "power1.inOut" }, 7.55);

    exitChips(["#c2a", "#c2b"], 11.35);
    tl.to("#stamp", { autoAlpha: 0, scale: 0.7, y: -30, duration: 0.3 }, 11.4);
    tl.to("#cap2", { autoAlpha: 0, y: -20, duration: 0.28 }, 11.45);
    showBridge("#b23", 11.6);
    swapCard("#s2", "#s3", 12.1, 1);

    // ===== Scene 3: structure builds in order =====
    // 12.1 - 18.4  (logic: scene → capability → experience)
    tl.to("#cap3", { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 12.5);
    tl.fromTo("#c3a",
      { autoAlpha: 0, y: 80, scale: 0.75 },
      { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" },
      12.7
    );
    tl.fromTo("#c3b",
      { autoAlpha: 0, y: 80, scale: 0.75 },
      { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" },
      13.25
    );
    tl.fromTo("#c3c",
      { autoAlpha: 0, y: 80, scale: 0.75 },
      { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" },
      13.8
    );
    // emphasize first principle
    tl.to("#c3a", { scale: 1.08, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, 14.8);

    exitChips(["#c3a", "#c3b", "#c3c"], 17.7);
    tl.to("#cap3", { autoAlpha: 0, y: -20, duration: 0.28 }, 17.75);
    showBridge("#b34", 17.95);
    swapCard("#s3", "#s4", 18.45, 1);

    // ===== Scene 4: hide complexity in the flow =====
    tl.fromTo("#c4a",
      { autoAlpha: 0, x: -90, scale: 0.8 },
      { autoAlpha: 1, x: 0, scale: 1, duration: 0.5, ease: "power2.out" },
      18.9
    );
    // model chip "tucks away" into the flow
    tl.to("#c4a", { x: 40, y: 40, scale: 0.85, autoAlpha: 0.35, duration: 0.55, ease: "power2.inOut" }, 19.7);
    tl.fromTo("#c4b",
      { autoAlpha: 0, y: 70, scale: 0.8 },
      { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" },
      20.1
    );
    tl.to("#cap4", { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 20.3);

    tl.to(["#c4a", "#c4b"], { autoAlpha: 0, y: -30, duration: 0.3 }, 24.15);
    tl.to("#cap4", { autoAlpha: 0, y: -20, duration: 0.28 }, 24.2);
    showBridge("#b45", 24.4);
    swapCard("#s4", "#s5", 24.9, 1);

    // ===== Scene 5: leave with one clear takeaway =====
    tl.fromTo("#c5a",
      { autoAlpha: 0, y: 90, scale: 0.75, rotate: -6 },
      { autoAlpha: 1, y: 0, scale: 1, rotate: 0, duration: 0.55, ease: "back.out(1.6)" },
      25.35
    );
    tl.to("#cap5", { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 25.7);
    tl.to("#s5 .card", { scale: 1.02, duration: 1.4, ease: "sine.inOut" }, 26.5);
    tl.to("#s5 .card", { scale: 1.0, duration: 1.4, ease: "sine.inOut" }, 27.9);
    // final settle hold
    tl.to("#c5a", { y: -6, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 29.2);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
